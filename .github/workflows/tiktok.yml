name: tiktok-webhook

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tiktok
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installeer dependencies
        run: pip install yt-dlp requests matplotlib

      - name: Draai script
        run: python tiktok_daily.py
        env:
          TIKTOK_USERNAME: ${{ secrets.TIKTOK_USERNAME }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_PING_USER_ID: ${{ secrets.DISCORD_PING_USER_ID }}
          REPORT_HOUR: "20"

      - name: Sla data op
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --staged --quiet || (git commit -m "Update data" && git push)